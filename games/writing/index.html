@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');

*{box-sizing:border-box}body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);margin:0;background:linear-gradient(150deg,#fdf0dc,#f5f9ee 55%,#e8f3ff)}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1080px;width:94%;margin:auto}.topbar{background:#fffdf4eF;position:sticky;top:0;z-index:9;box-shadow:0 2px 12px #354f7020}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:66px;flex-wrap:wrap}.brand{font-weight:900;color:#364b67}.home-link{display:inline-flex;gap:6px;border:1px solid #e1c79c;border-radius:50px;background:#fff8e8;padding:10px 16px;font-weight:800;font-size:13px}.hero{padding:42px 0 22px}.hero-card{position:relative;overflow:hidden;border-radius:27px;padding:36px;background:linear-gradient(115deg,#ffda9d,#fff0be 50%,#b9e8d7);border:4px solid white;box-shadow:0 10px 28px #42576a24}.hero-card:after{content:"✍️ 📚 🪶";position:absolute;right:22px;bottom:8px;font-size:53px;opacity:.65;transform:rotate(-8deg)}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:900;color:#875b2d}.hero h1{font-size:clamp(28px,4.8vw,48px);margin:8px 0}.hero p{line-height:1.75;font-weight:600;max-width:640px}.pill{display:inline-block;background:#fffaf0;border:1px solid #d8b889;border-radius:50px;padding:6px 12px;font-size:12px;font-weight:800}.summary{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:20px 0 8px}.summary strong{font-size:14px}.progress{height:12px;background:#e6dfd0;border-radius:20px;overflow:hidden;width:100%;margin-bottom:19px}.progress i{display:block;background:linear-gradient(90deg,#68bca0,#f0b858);height:100%;width:0;transition:width .3s}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:20px 0}.tab{border:2px solid #ebd9ba;border-radius:16px;background:#fffdf6;padding:14px 8px;text-align:center;color:#3e4e62;min-height:98px}.tab span{display:block;font-size:22px;font-weight:900}.tab small{font-size:11px;display:block;line-height:1.4;margin-top:5px}.tab.active{border-color:#ba8253;background:#ffe7b9;box-shadow:0 4px 0 #d4ad79}.tab.done{border-color:#7cbba3}.panel{background:#fffefa;border:2px solid #ead7b4;border-radius:25px;box-shadow:0 9px 24px #33445518;margin:16px 0 45px;padding:26px;min-height:400px}.chapter{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px dashed #e6ddc9;padding-bottom:16px;margin-bottom:23px}.chapter h2{font-size:27px;margin:4px 0}.muted{color:#647588;font-size:13px}.lesson{background:#f5f8ff;border-left:5px solid #7faad8;border-radius:13px;padding:17px;line-height:1.85;margin:17px 0}.lesson.warm{background:#fff5e5;border-color:#dfaa52}.lesson.green{background:#eaf8f0;border-color:#65ae93}.exercise{margin:24px 0}.exercise h3{font-size:19px;margin:12px 0}.prompt{font-size:14px;color:#55697c;line-height:1.85}.answer{width:100%;min-height:110px;resize:vertical;border:2px solid #d8dddf;border-radius:13px;background:#fff;font-size:16px;line-height:1.9;padding:13px 15px;color:#243448}.answer:focus,.tile-input:focus{outline:3px solid #ffe3a4;border-color:#b8803c}.counter{text-align:right;font-size:12px;color:#687c8a}.choicegroup{display:grid;gap:8px}.choice{display:flex;align-items:flex-start;gap:10px;background:#fff9ee;border:1px solid #e5d8c4;border-radius:13px;padding:12px;line-height:1.7}.choice input{margin-top:6px;accent-color:#4a997e}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.btn{border:0;border-radius:13px;background:#ed9e31;color:#263448;font-weight:900;padding:11px 18px;box-shadow:0 3px 0 #bd7a2b}.btn.alt{background:#e5edf8;box-shadow:0 3px 0 #b8cbe0}.btn.green{background:#a8e4c5;box-shadow:0 3px 0 #75b49b}.btn:hover{filter:brightness(1.04)}.feedback{display:none;border:2px solid #a3d5b6;border-radius:12px;background:#f0fbf3;margin:12px 0;padding:14px;line-height:1.8}.feedback.show{display:block}.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.tile{background:#fffbf0;border:2px solid #e9d9bc;border-radius:12px;padding:10px;min-height:109px}.tile label{display:block;font-size:12px;font-weight:900;color:#716145;margin-bottom:8px}.tile-input{width:100%;background:white;border:1px solid #d3c7b5;border-radius:8px;padding:8px;min-height:50px;font-size:14px}.tile.center{display:flex;align-items:center;justify-content:center;flex-direction:column;background:#ffdf9c;text-align:center}.tile.center b{font-size:17px}.sort-list{display:grid;gap:8px;counter-reset:step}.sort-row{display:flex;align-items:center;gap:10px;background:#fff7ec;border:1px solid #e8dac7;border-radius:12px;padding:9px}.sort-row select{font-size:16px;border:1px solid #d8c7ad;background:white;padding:7px;border-radius:8px}.sort-row span{line-height:1.65;font-size:14px}.segments{display:grid;grid-template-columns:1fr 1fr;gap:12px}.segment{background:#f7faff;padding:14px;border:1px solid #dfebf3;border-radius:14px}.segment h3{font-size:16px;margin:0 0 5px}.segment textarea{min-height:112px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.checks label{display:flex;gap:9px;background:#f7faf7;border:1px solid #dfebdf;border-radius:11px;padding:11px;line-height:1.6;font-size:13px}.checks input{accent-color:#409a73}.help{display:inline-block;border:0;background:#e9f1ff;color:#2c5c8b;padding:7px 12px;border-radius:15px;font-size:13px;font-weight:800}.hidden{display:none}.finish{background:#e8f7e8;border:2px solid #99c8a7;border-radius:14px;padding:17px;margin-top:18px}.mini-note{font-size:12px;color:#687587;line-height:1.8}.footer{text-align:center;color:#667582;padding:10px 0 35px;font-size:12px}
@media(max-width:720px){.tabs{grid-template-columns:repeat(2,1fr)}.tab:last-child{grid-column:span 2}.panel{padding:17px}.hero-card{padding:22px}.hero-card:after{opacity:.2}.nine{gap:4px}.tile{padding:6px}.tile label{font-size:10px}.tile-input{font-size:12px;padding:5px;min-height:58px}.segments,.checks{grid-template-columns:1fr}.chapter h2{font-size:23px}}@media print{.topbar,.buttons,.tabs,.home-link,.progress{display:none!important}.panel{box-shadow:none;border:0}.hero{padding:0}.answer{border:1px solid #aaa;min-height:90px}.game{page-break-inside:avoid}}

/* Free, on-device formative writing guidance */
.feedback-tool{margin-top:26px;padding:20px;border:2px solid #e5ba73;border-radius:19px;background:linear-gradient(130deg,#fff1d7,#f1faf6)}
.feedback-tool h3{margin:0 0 8px;font-size:21px}.feedback-tool p{font-size:14px;line-height:1.8}.feedback-panel{margin-top:13px;padding:17px;border:2px solid #a5ceb8;border-radius:14px;background:#fffefa;line-height:1.9}.feedback-panel[hidden]{display:none}.feedback-panel h4{margin:9px 0 3px;font-size:15px}.feedback-panel p{margin:3px 0 12px;font-size:14px;white-space:pre-wrap}.feedback-panel .teacher-note{background:#fff2d6;color:#66451e;padding:12px;border-radius:10px;font-weight:800;border:1px solid #edc999}.feedback-tool .disclosure{font-size:12px;color:#566778}

<header class="topbar"><div class="wrap bar"><a class="brand" href="../../index.html">🧭 華語探險家</a><a class="home-link" href="../../index.html">← 返回學習首頁</a></div></header>
<main class="wrap"><section class="hero"><div class="hero-card"><span class="eyebrow">WRITING ADVENTURE · GRADE 4</span><h1>✍️ 小小作家養成班</h1><p>先寫出一個畫面，再學會審題、取材、安排段落，最後完成自己的第一篇比賽型作文。</p><span class="pill">四年級初階 · 第 1～4 單元＋綜合實戰</span></div></section>
<div class="summary"><strong id="progress-label">已完成 0 / 5 個階段</strong><span class="muted">練習資料暫存於本裝置瀏覽器，不會上傳至伺服器。</span></div><div class="progress" aria-label="學習進度"><i id="progress-bar"></i></div>
<nav class="tabs" id="tabs" aria-label="選擇寫作單元"></nav>
<div id="panel" class="panel" aria-live="polite"></div></main>
<footer class="footer">華語探險家 · 寫作工坊｜用文字記錄自己的故事</footer>
<script>
(()=>{'use strict';
const KEY='chinese-explorer-writing-v1';
const titles=['把事情寫出畫面','讀懂題目不迷路','三分鐘想出材料','四段搭出好文章','第一次比賽作文'];
const intro=['將一句話變成能看見、聽見、感受到的情境','用圈、找、問抓住題目，不寫偏','先九宮格發想，再挑有用的材料','寫出開始、發展、精彩、感受','整合四個單元，完成《原來我也做得到》'];
let state={unit:0,values:{},done:{},checks:{}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object'){state={unit:Math.max(0,Math.min(4,Number(v.unit)||0)),values:v.values||{},done:v.done||{},checks:v.checks||{}}}}catch(e){}
const $=(sel)=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const key=(u,id)=>'u'+u+'_'+id;
const answer=(id,title,placeholder='',rows=4)=>`<div class="exercise"><h3>${title}</h3><textarea class="answer" data-field="${esc(id)}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(state.values[key(state.unit,id)]||'')}</textarea><div class="counter" data-counter="${esc(id)}"></div></div>`;
const choose=(id,title,options)=>`<div class="exercise"><h3>${title}</h3><div class="choicegroup">${options.map((o,i)=>`<label class="choice"><input type="radio" name="${esc(id)}" data-radio="${esc(id)}" value="${i}" ${state.values[key(state.unit,id)]==i?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`;
const button=(txt,act,cls='')=>`<button type="button" class="btn ${cls}" data-action="${act}">${txt}</button>`;
const note=(msg)=>`<div class="lesson">${msg}</div>`;
const checkset=(names, prefix)=>`<div class="checks">${names.map((name,i)=>`<label><input type="checkbox" data-check="${prefix+i}" ${state.checks[key(state.unit,prefix+i)]?'checked':''}> ${esc(name)}</label>`).join('')}</div>`;
const prompts=['誰在場？','在哪裡？','我要嘗試什麼？','我最害怕什麼？',null,'我做了什麼？','別人怎麼說？','最關鍵的瞬間？','最後結果與感受？'];
const nine=(id,title,arr=prompts)=>`<div class="exercise"><h3>${title}</h3><div class="nine">${arr.map((p,i)=>p===null?`<div class="tile center"><small>作文題目</small><b>${id==='final'?'原來我也做得到':'一次勇敢的嘗試'}</b></div>`:`<div class="tile"><label for="${id+i}">${esc(p)}</label><textarea id="${id+i}" class="tile-input" data-field="${id+i}" rows="2" placeholder="寫下關鍵字">${esc(state.values[key(state.unit,id+i)]||'')}</textarea></div>`).join('')}</div></div>`;
const segment=(id,title)=>`<div class="segment"><h3>${title}</h3><textarea class="answer" data-field="${id}" placeholder="用自己的話寫出這一段要說什麼">${esc(state.values[key(state.unit,id)]||'')}</textarea></div>`;
const outline=id=>`<div class="exercise"><h3>四段大綱</h3><div class="segments">${['第一段｜開始','第二段｜發展','第三段｜最精彩','第四段｜收尾與感受'].map((t,i)=>segment(id+i,t)).join('')}</div></div>`;
const feedback=(id)=>`<div class="feedback" id="${id}"></div>`;
const content=[
()=>note('<b>先比一比：</b> A：「我去遊樂園。我玩了很多遊樂設施，非常好玩。」<br>B：「大怒神慢慢升高，我緊緊抓住扶手，手心冒汗。突然『咻』的一聲，我忍不住大叫！」<br><b>寫作祕訣：</b>一件事情＋具體細節＋我的感受。')+choose('example','先觀察：哪個版本比較有畫面？',['A：只說事情很好玩','B：描寫動作、聲音和身體反應'])+button('檢查觀察結果','check1','alt')+feedback('feedback1')+answer('nervous','挑戰一｜把「我很緊張」放大','不能再寫「緊張」兩字，改用心跳、手、眼睛、動作等細節。')+answer('moment','挑戰二｜寫約 100 字的小事件','四選一：下課鐘響了／打翻水壺／老師突然叫到名字／比賽前一分鐘。')+checkset(['有一個具體動作','有一句話或一個聲音','有心情變化','不是只寫「很開心／很緊張」'],'detail'),
()=>note('<b>審題三步驟：</b>圈出關鍵字 → 找人物／事情／時間／感受 → 問自己「這篇真正要寫什麼？」<br>例如《我最想感謝的人》要寫出「為什麼感謝」及具體事件，不只是介紹外表。')+choose('off','題目偵探｜《我最想感謝的人》，哪段最可能離題？',['甲：媽媽照顧生病的我，整夜沒有睡。','乙：媽媽喜歡水果、看電視，家裡還養了一隻狗。','丙：老師陪我訂正題目，鼓勵我繼續努力。'])+button('檢查答案','check2','alt')+feedback('feedback2')+answer('topic1','題目：《一次難忘的經驗》','圈出關鍵字，寫出一件你想描述的事情，以及「為什麼難忘」。')+answer('topic2','題目：《我最喜歡的一堂課》','除了課名，還要寫出喜歡的原因和一件具體經驗。')+checkset(['內容有回應題目','人物和事件清楚','至少一件具體事情能證明主題'],'topic'),
()=>note('看到題目不要急著動筆。<b>先寫九宮格，再挑三個最重要的材料。</b> 三個標準：切題、有話可寫、有具體畫面。')+nine('nine','九宮格任務｜《一次勇敢的嘗試》')+answer('best','挑選最想寫的三個材料','列出 1、2、3，說明為什麼值得寫。',3)+note('<b>材料排排站：</b>依照事情發生的合理順序，替每張卡選一個不同的號碼。')+`<div class="sort-list">${['爸爸放手後，我自己騎出十幾公尺。','第一次上車，車子一直往旁邊倒。','我摔倒擦破皮，很想回家。','暑假某天，爸爸決定教我騎車。','爸爸替我擦藥，鼓勵我再試。','回家時，我懂得耐心和勇氣的重要。'].map((t,i)=>`<div class="sort-row"><label><select data-order="${i}" aria-label="第${i+1}張材料的先後順序"><option value="">順序</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${state.values[key(state.unit,'ord'+i)]==n?'selected':''}>${n}</option>`).join('')}</select></label><span>${t}</span></div>`).join('')}</div>`+button('檢查材料順序','check3','alt')+feedback('feedback3'),
()=>note('<b>四段骨架：</b>① 開始（人事時地）→ ② 發展（經過與困難）→ ③ 最精彩（重要事件與心情）→ ④ 收尾（結果、感受與收穫）。<br>四段只是初學工具，不是所有文章都必須固定四段。')+outline('regret')+answer('gift','段落升級｜《一份特別的禮物》','奶奶親手做了一個小布袋。請選一段，加入動作、對話與心情，擴寫成 80～120 字。',6)+checkset(['有明確開始','寫出發展過程','第三段寫出重要畫面','有結局與感受','至少一段加入動作、對話或心情'],'structure'),
()=>note('<b>綜合挑戰：《原來我也做得到》</b><br>依序完成審題、九宮格、四段大綱與正式作文。第一次不限時，之後再試 60 分鐘寫作；字數參考 450～600 字。')+answer('focus','第一步｜審題：這篇文章一定要出現什麼改變？','例如：原本害怕／做不到 → 經過嘗試或努力 → 終於做到了。',3)+nine('final','第二步｜九宮格取材',['原本不會什麼？','誰在幫助我？','在哪裡？','第一次失敗？',null,'最困難的地方？','我做了什麼？','成功的瞬間？','最後的感受？'])+outline('finalpara')+answer('full','第四步｜正式寫作','先寫完整的文章。建議 450～600 字，初次不用計時。',14)+`<div class="exercise"><h3>第五步｜六字檢查法</h3>${checkset(['題：是否扣緊題目？','人：人物與動作是否清楚？','事：過程與結果是否完整？','段：最重要部分是否寫得充分？','句：句子是否通順？','字：錯字與標點是否檢查？'],'six')}</div>`];
function render(){const u=state.unit;$('#tabs').innerHTML=titles.map((t,i)=>`<button type="button" class="tab ${i===u?'active':''} ${state.done[i]?'done':''}" data-unit="${i}" aria-current="${i===u?'step':'false'}"><span>${state.done[i]?'✓':i===4?'★':i+1}</span><small>${esc(t)}</small></button>`).join('');$('#panel').innerHTML=`<div class="chapter"><div><span class="eyebrow">${u===4?'綜合挑戰':'單元 '+(u+1)+' / 4'}</span><h2>${titles[u]}</h2><p class="muted">${intro[u]}</p></div><span class="pill">${state.done[u]?'✓ 已完成':'✦ 進行中'}</span></div>`+content[u]()+`<section class="feedback-tool" aria-label="寫作回饋"><h3>📝 寫作小教練｜初階回饋</h3><p>完成文字後，點選下方按鈕，檢查字數、關鍵描寫提示及練習是否完整，取得下一步的修改建議。</p><button type="button" class="btn green" data-action="review">完成寫作，看看指導語</button><div id="writing-feedback" class="feedback-panel" role="status" aria-live="polite" hidden></div><p class="disclosure">本站使用不連網的固定規則產生提示，不會理解作品的深層意義，也不會自動評定作文好壞。</p></section><div class="buttons">${button('儲存練習','save','alt')}${button('完成本單元','complete','green')}${button('下載我的作品','export','alt')}${u<4?button('前往下一單元 →','next'):''}</div><div class="mini-note">文字寫作不會以字數或關鍵詞自動評分；請根據提示自主檢查，必要時請老師提供回饋。使用共用裝置時記得下載作品並清除資料。</div>`;
$('#panel').querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('input',()=>{state.values[key(u,el.dataset.field)]=el.value;save();counter(el)});counter(el)});
$('#panel').querySelectorAll('[data-radio]').forEach(el=>el.addEventListener('change',()=>{state.values[key(u,el.dataset.radio)]=el.value;save()}));
$('#panel').querySelectorAll('[data-order]').forEach(el=>el.addEventListener('change',()=>{state.values[key(u,'ord'+el.dataset.order)]=el.value;save()}));
$('#panel').querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{state.checks[key(u,el.dataset.check)]=el.checked;save()}));
$('#panel').querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));
$('#tabs').querySelectorAll('[data-unit]').forEach(el=>el.addEventListener('click',()=>go(+el.dataset.unit)));
const n=Object.values(state.done).filter(Boolean).length;$('#progress-label').textContent='已完成 '+n+' / 5 個階段';$('#progress-bar').style.width=(n/5*100)+'%';save()}
function counter(el){const target=document.querySelector('[data-counter="'+el.dataset.field+'"]');if(target)target.textContent='目前 '+[...el.value.replace(/\s/g,'')].length+' 字'}
function go(n){state.unit=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function show(id,text){const el=document.getElementById(id);if(el){el.textContent=text;el.classList.add('show')}}

function review(){
 const u=state.unit;
 const get=id=>String(state.values[key(u,id)]||'').trim();
 const size=v=>[...v.replace(/\s/g,'')].length;
 const feedback=[];
 const add=(heading,msg)=>feedback.push([heading,msg]);
 const notes={
  0:'試著用動作、聲音、身體反應或人物說話，呈現事件中最有畫面的時刻。',
  1:'重新圈出題目的關鍵字，並找一件能證明主題的具體事件。',
  2:'先記下想法，再挑三個最切題、最有畫面、自己最熟悉的材料。',
  3:'先交代事件，再呈現發展；最重要的情節可多寫一些細節，最後寫結果與感受。',
  4:'回頭檢查「原本做不到 → 遇到困難 → 努力嘗試 → 改變與收穫」是否清楚。'
 };
 if(u===0){
  const a=get('nervous'),b=get('moment'),both=[a,b].filter(Boolean);
  if(!both.length)add('練習進度','🌱 再加油！還沒看到你的文字呢。可以先從一句話開始，想一想當時的動作或心跳，再慢慢把畫面寫出來。每一位小作家，都是從第一句話開始的！');
  else {
   const combined=both.join('\n');
   const n=size(b),total=both.map(size).reduce((x,y)=>x+y,0);
   if(!a||!b||n<100){
    add('練習進度','🌱 再加油！你已經寫下 '+total+' 字，這就是很好的起步。'+(!a?'先試著改寫「我很緊張」，用動作或身體感覺說故事。':!b?'接著挑一件小事件，把最精彩的瞬間寫下來。':'小事件目前約 '+n+' 字，試著補上動作、聲音或心情變化，朝約 100 字的練習目標前進。'));
   }else if(n<=150){
    add('練習進度','🎉 完成任務，恭喜你！兩項練習都有內容，小事件也寫了約 '+n+' 字，達到這次約 100～150 字的練習範圍。請為自己的努力拍拍手，再讀一次，看看細節能不能更生動！');
   }else{
    add('練習進度','🌟 超額完成，太棒了！你完成兩項練習，小事件已寫到約 '+n+' 字，超過這次參考篇幅。願意多寫很值得鼓勵！接下來試試挑出最有畫面的細節，刪去重複的句子，讓文章更精采；字數多不一定代表寫得更好喔。');
   }
   if(a.includes('緊張'))add('改寫任務','💛 你願意把心情寫下來，已經跨出很棒的一步！這一題有個小挑戰：先把「緊張」兩字藏起來，想像當時的手心、心跳或眼神，讓讀者自己感受到那份心情。你可以試著改一句看看！');
   else if(a)add('改寫任務','✨ 做得好！你記得這一題的小約定，沒有直接使用「緊張」兩字。現在邀請你當一回小導演：再讀一次自己的句子，看看能不能多放進一個動作、表情或身體感覺，讓讀者彷彿親眼看見那一刻。慢慢修改，你的文字會越來越有畫面！');
   if(/[「」『』！!?？]|說|喊|叫|咚|啪|叮|響|聽/.test(combined))add('聲音線索','文字中出現了對話、標點或可能與聲音有關的詞語；請自己確認它們是否真的讓畫面更鮮明。');
   else add('下一步任務','試著在段落中加上一句話或一個現場聲音，讓讀者感覺自己也在場。');
   if(!/心|汗|手|腳|眼|臉|怕|喜|笑|發抖|呼吸|胸口/.test(combined))add('感受提示','可以再想想當時身體有什麼反應，或心情如何轉變。');
  }
 }else if(u===1){
  const a=get('topic1'),b=get('topic2');
  if(!a&&!b)add('先完成練習','請先寫出題目關鍵字與你準備寫的具體事件。');
  else{
   add('審題練習','已填寫 '+[a,b].filter(Boolean).length+' / 2 個審題練習。');
   if(a)add('《一次難忘的經驗》','請自己核對：文章會不會集中在「一次」經驗？是否解釋它為什麼難忘？');
   if(b)add('《我最喜歡的一堂課》','請自己核對：除了說喜歡哪一課，有沒有具體的課堂經歷與喜歡的理由？');
   if(!a||!b)add('下一步任務','補上尚未完成的題目，練習用「人物、事件、原因」三個角度審題。');
  }
 }else if(u===2){
  const filled=[0,1,2,3,5,6,7,8].filter(i=>get('nine'+i)).length;
  add('九宮格進度','已填寫 '+filled+' / 8 個發想欄位。九宮格不必每格都有材料，但可以多想幾種方向。');
  if(filled<4)add('發想提示','試著補上「在場人物、地點、困難、行動」等內容，不急著寫作文。');
  else add('選材提醒','材料開始累積了！請從中選出和題目最相關、最容易寫出具體畫面的三項。');
  if(!get('best'))add('下一步任務','請在「三個材料」的欄位寫出你最想用的內容。');
  else add('取材確認','你已填寫選材欄位。接下來確認每項是否切題，並把材料安排成合理順序。');
  const order=[0,1,2,3,4,5].map(i=>Number(get('ord'+i)));
  if(order.every(n=>n>=1&&n<=6)){
    const target=[5,2,3,1,4,6];
    add('材料排序',order.every((n,i)=>n===target[i])?'六張材料的順序符合教材建議。可以再想想哪些內容應放在最精彩的一段。':'排序還能再調整。提示：爸爸開始教學是第一步，回家後的體會是最後一步。');
  }
 }else if(u===3){
  const parts=[0,1,2,3].map(i=>get('regret'+i));
  add('四段骨架','已填寫 '+parts.filter(Boolean).length+' / 4 段。'+(parts.some(v=>!v)?'先替每一段寫一個重點，再把重要情節擴寫。':'四段都有內容了，接著看是否有清楚的事情發展。'));
  const g=get('gift'),n=size(g);
  if(!g)add('段落擴寫','試選一段練習擴寫，加入具體動作、一句話或聲音，以及心情變化。');
  else add('擴寫字數','段落目前約 '+n+' 字。教材參考範圍是 80～120 字；'+(n<80?'可再補充具體細節。':n>120?'可以試著刪去重複句子，保留最精彩的內容。':'字數落在參考範圍內，仍請檢查是否具體且切題。'));
  if(parts[2]&&parts[2].length<parts[0].length)add('第三段提醒','第三段通常值得多安排重要事件與細節；你可以確認最精彩的地方是否寫得充分。');
 }else{
  const essay=get('full'),n=size(essay);
  if(!essay)add('先完成寫作','先依照審題、九宮格及四段大綱，寫出初稿，再取得初階提醒。');
  else{
   add('作文篇幅','目前約 '+n+' 字。教材建議初次練習約 450～600 字，並非品質分數。'+(n<450?'可檢查是否漏掉了重要事件、人物反應與感受。':n>600?'可以檢查是否有重複敘述，留下最能呈現轉變的內容。':'字數落在參考範圍內，請進一步檢查文章內容。'));
   if(!get('focus'))add('審題提醒','請補上第一步的審題想法：你原本做不到什麼，最後有什麼改變？');
   const p=[0,1,2,3].filter(i=>get('finalpara'+i)).length;
   add('大綱檢查','四段大綱已填寫 '+p+' / 4 段。正式文章也請自行確認事件有開始、發展、重要過程與收尾。');
   const six=[0,1,2,3,4,5].filter(i=>state.checks[key(u,'six'+i)]).length;
   add('交稿前提醒','六字自我檢查已勾選 '+six+' / 6 項：題、人、事、段、句、字。勾選僅表示自己檢查過，不代表網站已驗證內容。');
  }
 }
 if(!feedback.length)add('繼續練習',notes[u]);
 add('寫作小教練提醒','以上屬於字數、欄位與少量提示詞的規則式檢查，並不能判定文章的思想、情感或真正品質。'+notes[u]);
 add('請交給作文老師','我的評語只是初階的分析，請你再拿給你的作文老師做進一步的批閱喔！');
 const box=document.getElementById('writing-feedback');
 if(!box)return;
 box.replaceChildren();
 for(const [title,body] of feedback){
   const h=document.createElement('h4');h.textContent=title;
   const p=document.createElement('p');p.textContent=body;
   if(title==='請交給作文老師')p.className='teacher-note';
   box.append(h,p);
 }
 box.hidden=false;
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function act(action){if(action==='review'){review()}else if(action==='save'){save();alert('已儲存於此瀏覽器。請記得下載重要作品。')}else if(action==='check1'){show('feedback1',state.values[key(0,'example')]==='1'?'答對了！B 有動作、聲音、身體反應，讀者更容易想像畫面。':'再看看 B 的手心冒汗、抓住扶手與「咻」的聲音，這些都是有畫面的細節。')}else if(action==='check2'){show('feedback2',state.values[key(1,'off')]==='1'?'答對了！乙若只停在外表和喜好，沒有說明感謝的原因，就容易偏題。':'想想哪段沒有回應「為什麼想感謝」，再試一次。')}else if(action==='check3'){const seq=[5,2,3,1,4,6];const got=seq.map((_,i)=>Number(state.values[key(2,'ord'+i)]||0));show('feedback3',got.every((n,i)=>n===seq[i])?'順序正確！開始教學→不穩→跌倒→鼓勵→成功→感受。':'還可以調整。提示：暑假爸爸教學是開始；回家得到體會是最後。請選 1～6 且不要重複。')}else if(action==='complete'){state.done[state.unit]=true;save();render();const el=document.querySelector('.chapter');el.insertAdjacentHTML('afterend','<div class="finish" role="status">🌟 已標記完成本階段！完成表示你已自行練習，並不代表內容通過教師評量。</div>')}else if(action==='next'){go(Math.min(4,state.unit+1))}else if(action==='export'){const text=['華語探險家｜小小作家養成班','匯出時間：'+new Date().toLocaleString('zh-TW')];for(let i=0;i<5;i++){text.push('\n### '+titles[i]);for(const [k,v] of Object.entries(state.values)){if(k.startsWith('u'+i+'_'))text.push(k.replace(/^u\d+_/, '')+'：'+v)}}const blob=new Blob([text.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='我的小小作家練習.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}}render();
})();
</script></body></html>
